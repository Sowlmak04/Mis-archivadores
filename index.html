<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mis Archivadores" />
  <meta name="description" content="Índices rápidos para archivadores, cajas y cajones mediante NFC." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Mis Archivadores</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Casa</p>
        <h1 id="screenTitle">Mis Archivadores</h1>
      </div>
      <button id="settingsBtn" class="icon-button" aria-label="Ajustes" title="Ajustes" aria-expanded="false" aria-controls="settingsMenu">
        <span>•••</span>
      </button>
      <div id="settingsMenu" class="settings-menu" role="menu">
        <button role="menuitem" data-menu-route="zones-edit"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h6l2 2h8v10H4z"/><path d="M4 10.5h16"/></svg></span><strong>Editar zonas</strong></button>
        <button role="menuitem" data-menu-route="transfer"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v12m0 0-3.5-3.5M8 16l3.5-3.5M16 20V8m0 0-3.5 3.5M16 8l3.5 3.5"/></svg></span><strong>Importar/Exportar</strong></button>
        <button role="menuitem" data-menu-route="personalization"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z"/></svg></span><strong>Personalización</strong></button>
        <div class="app-version" aria-label="Versión de la aplicación">Mis Archivadores · v0.11.3</div>
      </div>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Navegación principal">
      <button class="tab is-active" data-route="home" aria-label="Inicio">
        <span class="tab-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-7h5v7"/></svg></span>
        <span>Inicio</span>
      </button>
      <button class="tab" data-route="search" aria-label="Buscar">
        <span class="tab-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></span>
        <span>Buscar</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="./app.js"></script>
</body>
</html>

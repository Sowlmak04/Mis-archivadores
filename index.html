<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mis Archivadores" />
  <meta name="description" content="Índices rápidos para archivadores, cajas y cajones mediante NFC." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Mis Archivadores</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Casa</p>
        <h1 id="screenTitle">Mis Archivadores</h1>
      </div>
      <button id="settingsBtn" class="icon-button" aria-label="Ajustes" title="Ajustes" aria-expanded="false" aria-controls="settingsMenu">
        <span>•••</span>
      </button>
      <div id="settingsMenu" class="settings-menu" role="menu">
        <button role="menuitem" data-menu-route="zones-edit"><span>⌗</span><strong>Editar zonas</strong></button>
        <button role="menuitem" data-menu-route="transfer"><span>⇅</span><strong>Importar/Exportar</strong></button>
        <button role="menuitem" data-menu-route="personalization"><span>◐</span><strong>Personalización</strong></button>
      </div>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Navegación principal">
      <button class="tab is-active" data-route="home" aria-label="Inicio">
        <span class="tab-icon">⌂</span>
        <span>Inicio</span>
      </button>
      <button class="tab" data-route="search" aria-label="Buscar">
        <span class="tab-icon">⌕</span>
        <span>Buscar</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="./app.js"></script>
</body>
</html>
